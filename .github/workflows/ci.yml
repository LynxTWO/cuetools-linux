---
name: ci

# Build and test CUETools Linux on the target platform through
# eng/build.sh, the single source of truth: it stages the pinned
# extern/cuetools_2026 submodule's vendor sources, builds with the fork's
# lock machinery neutralized (decision D-034; fork issue #7), runs the
# engine smoke tests, and asserts the submodule stayed byte-clean.

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build, test, and verify submodule cleanliness
        run: ./eng/build.sh

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish (NativeAOT), build tests
        run: ./eng/build.sh --publish

      - name: Build .deb and AppImage with D-025 size gates
        run: |
          ./eng/package-deb.sh
          ./eng/package-appimage.sh

      - name: Clean-install the .deb and smoke-launch (R-010)
        run: |
          sudo apt-get install -y ./bin/packages/cuetools-linux_*_amd64.deb
          xvfb-run -a cuetools-linux --smoke
          test -f /usr/share/applications/cuetools-linux.desktop

      - name: Smoke-launch the AppImage
        run: |
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          xvfb-run -a ./bin/packages/CUEToolsLinux-*-x86_64.AppImage --smoke

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            bin/packages/*.deb
            bin/packages/*.AppImage
          if-no-files-found: error
